[project]
name = "atomic_hack_back"
version = "0.1.0"
description = "FastAPI backend for Atomic Hack"
authors = [{name = "alexn1n"}]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "bcrypt==4.3.0",
    "passlib[bcrypt]",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic[email]",
    "sqlalchemy",
    "boto3",
    "python-dotenv",
    "python-pptx",
    "psycopg[binary]",
    "psycopg",
    # LangChain ecosystem
    "langchain-core",
    "langchain",
    "langchain-community",
    "langchain-openai>=0.0.5",
    "langchain-qdrant>=0.1.0",
    "langchain-experimental",
    "langchain-unstructured",
    # Document processing
    "unstructured[pdf,docx]>=0.15.0",
    # Vector DB
    "qdrant-client>=1.7.0",
    # Document processing
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "pypandoc_binary",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "tiktoken>=0.5.0",
    "openpyxl>=3.1.0",
    # HTML processing
    "beautifulsoup4>=4.12.0",
    # HTTP client for PDF conversion
    "httpx>=0.25.0",
    "msoffcrypto-tool",
    # Image generation
    "AsyncKandinsky"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routers"]
include = ["main.py"]
