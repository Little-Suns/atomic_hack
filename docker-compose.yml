services:
  postgres:
    image: postgres:16-alpine
    container_name: atomic_hack_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atomic_hack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atomic_hack_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: atomic_hack_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - atomic_hack_network

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: atomic_hack_gotenberg
    ports:
      - "3030:3030"
    command:
      - "gotenberg"
      - "--api-port=3030"
      - "--api-timeout=300s"
    networks:
      - atomic_hack_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: atomic_hack_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/atomic_hack
      - QDRANT_URL=http://qdrant:6333
      - GOTENBERG_URL=http://gotenberg:3030
    env_file:
      - atomic_hack_back/.env
    volumes:
      - ./atomic_hack_back:/app
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      gotenberg:
        condition: service_started
    restart: unless-stopped
    networks:
      - atomic_hack_network

  minio:
    image: minio/minio:latest
    container_name: atomic_hack_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - atomic_hack_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.atomichack.junkjammerservice.me}
        VITE_API_MODE: ${VITE_API_MODE:-api}
    container_name: atomic_hack_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - atomic_hack_network

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  backend_logs:
    driver: local
  minio_data:
    driver: local

networks:
  atomic_hack_network:
    driver: bridge
